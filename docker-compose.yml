services:
  db:
    image: postgres:15
    container_name: spotify_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: spotify_optimizer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d spotify_optimizer"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: spotify_app
    volumes:
      - .:/app
    ports:
      - "8501:8501"

    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/spotify_optimizer
      - SPOTIPY_CLIENT_ID=${SPOTIPY_CLIENT_ID}
      - SPOTIPY_CLIENT_SECRET=${SPOTIPY_CLIENT_SECRET}
      - SPOTIPY_REDIRECT_URI=${SPOTIPY_REDIRECT_URI}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TZ=${TZ:-Europe/Berlin}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
